# Nginx Configuration for Weather Web Service
# This configuration provides HTTPS termination and reverse proxy to Flask app

events {
    # Maximum number of simultaneous connections per worker process
    worker_connections 1024;
}

http {
    # Include MIME types for proper content type handling
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Configuration
    # Access log records all incoming requests
    access_log /var/log/nginx/access.log;
    # Error log records server errors and issues
    error_log /var/log/nginx/error.log;

    # HTTP Server (Port 80)
    # Redirects all HTTP traffic to HTTPS for security
    # Validates: Requirements 1.4 (HTTPS enforcement)
    server {
        listen 80;
        server_name _;  # Catch-all server name
        
        # Redirect all HTTP requests to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server (Port 443)
    # Main application server with SSL/TLS encryption
    # Validates: Requirements 1.4, 8.3
    server {
        listen 443 ssl;
        server_name _;  # Catch-all server name (replace with your domain in production)

        # SSL Certificate Configuration
        # These paths are mounted from the host's ./ssl directory
        # For production, use certificates from a trusted CA (e.g., Let's Encrypt)
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # SSL Protocol Configuration
        # Only allow TLS 1.2 and 1.3 for security
        ssl_protocols TLSv1.2 TLSv1.3;
        # Use strong cipher suites, exclude weak ones
        ssl_ciphers HIGH:!aNULL:!MD5;
        # Prefer server cipher order for better security
        ssl_prefer_server_ciphers on;

        # Reverse Proxy Configuration
        # Forward all requests to the Flask application
        location / {
            # Forward to Flask app container on port 5000
            proxy_pass http://flask-app:5000;
            
            # Preserve original host header
            proxy_set_header Host $host;
            # Pass client's real IP address
            proxy_set_header X-Real-IP $remote_addr;
            # Pass full client IP chain for load balancers
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Indicate that original request was HTTPS
            proxy_set_header X-Forwarded-Proto $scheme;
            # Pass unique request ID for tracing
            proxy_set_header X-Request-ID $request_id;
            
            # Timeout Configuration
            # Time to establish connection with Flask app
            proxy_connect_timeout 60s;
            # Time to send request to Flask app
            proxy_send_timeout 60s;
            # Time to read response from Flask app
            proxy_read_timeout 60s;
        }
    }
}
